[pytest]
testpaths = testes
python_files = test_*.py
addopts = -q --strict-markers

# matplotlib e reportlab emitem avisos de depreciação das próprias
# dependências; silenciá-los mantém legível a saída dos nossos testes.
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:reportlab.*
    ignore:.*pyparsing.*:UserWarning
    ignore::PendingDeprecationWarning
